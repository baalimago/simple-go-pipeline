name: Validate + update in README.md

on:
  workflow_call:
    inputs:
      go-version:
        description: "Change this to update go version"
        default: "1.25"
        type: string
      gofumpt:
        description: "Use to toggle gofumpt validation step"
        default: true
        type: boolean
      gofumpt-version:
        description: "Change this to update gofumpt version"
        default: "v0.8.0"
        type: string
      staticcheck:
        description: "Use to toggle staticcheck validation step"
        default: true
        type: boolean
      staticcheck-version:
        description: "Change this to update gofumpt version"
        default: "2025.1.1"
        type: string
      test:
        description: "Use to toggle the entire test validation step"
        default: true
        type: boolean
      test-race:
        description: "Use to toggle the -race flag within the test validation step"
        default: true
        type: boolean
      test-coverpkg:
        description: "Use to set -coverpkg flag within the test validation step. If left empty, the flag is omitted and each package is instrumented by its own tests only. See https://go.dev/doc/go1.10#test for more details."
        default: "./..."
        type: string
      test-readme-coverage:
        description: "Use to toggle the coverage readme update within the test validation step"
        default: true
        type: boolean
      percentaverage-version:
        description: "Change this to update percentaverage version"
        default: "v1.0.5"
        type: string
      # See: https://github.com/orgs/community/discussions/26560 for details to why this is used
      test-readme-coverage-user:
        description: "Use to set the username of the git account which will push the badge update"
        default: "github-actions[bot]"
        type: string
      test-readme-coverage-email:
        description: "Use to set the email of the git account which will push the badge update"
        default: "41898282+github-actions[bot]@users.noreply.github.com"
        type: string
      prerun-step-cmd:
        description: Command to run before other tests are run
        default: ""
        type: string
      build-command:
        description: "Shell command building the project in the build job; default: go build -v ./..."
        default: "go build -v ./..."
        type: string
      test-command:
        description: "Shell command running the test suite in the validate job; when empty, the default go test construction with the race and coverpkg flags runs. The command must write the coverage profile to /tmp/cover.out when the default coverage-command is kept"
        default: ""
        type: string
      coverage-command:
        description: "Shell command printing the coverage percentage on stdout; default: the aggregate of /tmp/cover.out, which the default test command writes"
        default: "go tool cover -func /tmp/cover.out | tail -1 | grep -oE '[0-9]+\\.[0-9]+'"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "${{ inputs.go-version }}"

      - name: Build
        shell: bash
        run: ${{ inputs.build-command }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go + testing tools
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "${{ inputs.go-version }}"

      - name: Prerun
        shell: bash
        if: ${{ inputs.prerun-step-cmd }}
        run: ${{ inputs.prerun-step-cmd }}

      - name: Staticcheck
        if: ${{ inputs.staticcheck }}
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@${{ inputs.staticcheck-version }} ./...
        shell: bash

      - name: Gofumpt
        if: ${{ inputs.gofumpt }}
        run: |
          output=$(go run mvdan.cc/gofumpt@${{ inputs.gofumpt-version }} -l .)
          if [ ! -z "$output" ]; then echo "$output" && exit 1; fi
        shell: bash

      - name: Test
        if: ${{ inputs.test }}
        run: |
          if [[ -n "${{ inputs.test-command }}" ]]; then
            testCmd="${{ inputs.test-command }}"
          else
            raceFlag=""
            if [ "${{ inputs.test-race }}" == "true" ]; then
              raceFlag="-race"
            fi
            coverPkgInput="${{ inputs.test-coverpkg }}"
            if [ ! -z "$coverPkgInput" ]; then
              coverPkg="-coverpkg $coverPkgInput"
            fi

            testCmd="go test $raceFlag $coverPkg -coverprofile /tmp/cover.out ./..."
          fi

          if [ "${{ inputs.test-readme-coverage }}" != "true" ]; then
            $testCmd
            # On exit 1, pipeline will break automatically. So in order to stop automatic coverage
            # exit 0 here to stop further processing
            exit 0
          fi

          # This is done to catch the test results, while still reporting some test failure
          if ! $testCmd > /tmp/testResult; then
            cat /tmp/testResult
            exit 1
          fi
          # Exit early on pullrequests, as we dont want it to update testcoverage then
          if [ $GITHUB_EVENT_NAME == "pull_request" ]; then
            exit 0
          fi
          if [[ "${{ inputs.coverage-command }}" == *percentaverage* ]]; then
            go install github.com/baalimago/percentaverage@${{ inputs.percentaverage-version }}
          fi
          perc=$(${{ inputs.coverage-command }})
          perc_rounded=${perc%%.*}
          if [ $perc_rounded -ge 80 ]; then
            rating="😍👌"
          elif [ $perc_rounded -ge 50 ]; then
            rating="😌👏"
          elif [ $perc_rounded -ge 20 ]; then
            rating="😒👍"
          else
            rating="😠👎"
          fi

          # Note that you need to have some line starting with "Test coverage:" for this to work
          sed -i "s/Test coverage:.*/Test coverage: $perc% $rating/" README.md

          if [ -z "$(git status --porcelain)" ]; then
            echo "Test coverage unchanged"
            exit 0
          fi

          git add README.md
          git config --global user.email "${{ inputs.test-readme-coverage-email }}"
          git config --global user.name "${{ inputs.test-readme-coverage-user }}"
          git commit -m "Github Action: Updated testcoverage"
          git push

        shell: bash
