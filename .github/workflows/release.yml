# Reusable release workflow.
#
# Pure-Go callers omit the native inputs and get the previous behavior: a
# cross-compiled matrix (darwin and linux on amd64, arm64, and 386, excluding
# darwin-386) built on ubuntu-latest with the default `go build`. Native
# callers (CGo, vendored C libraries) pass `targets` plus the per-target
# commands; each target runs on its own runner because GOOS/GOARCH
# cross-compilation cannot build CGo.
#
# One assembly job creates one release after every target succeeded, so no
# matrix job can race to create a release or attach assets to an unrelated
# latest release. The checksum file is created over the exact bytes that the
# release uploads.
#
# The tag must be a semver version: v<major>.<minor>.<patch> with an optional
# prerelease identifier (v1.2.3-rc1) and optional build metadata. A tag with a
# prerelease identifier creates a GitHub prerelease; a stable tag creates a
# normal release; anything else fails before any build starts.
name: Release to windows, darwin and linux

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version for every target"
        default: "1.26"
        type: string
      project-name:
        description: "Binary root name; artifacts are <project-name>-v<version>-<os>-<arch>[.exe]"
        required: true
        type: string
      branch:
        description: "Branch to which the release should target"
        required: true
        type: string
      version-var:
        description: "Go linker variable (importpath.name) receiving the release version; empty disables the -X flag in the default build"
        default: ""
        type: string
      targets:
        description: >
          JSON array of {os, arch, runner} target triples; each entry runs on
          its own runner and must contain at least one entry. When omitted, the
          default pure-Go matrix (darwin and linux on amd64, arm64, and 386,
          excluding darwin-386) runs on ubuntu-latest.
        default: '[{"os":"darwin","arch":"amd64","runner":"ubuntu-latest"},{"os":"darwin","arch":"arm64","runner":"ubuntu-latest"},{"os":"linux","arch":"amd64","runner":"ubuntu-latest"},{"os":"linux","arch":"arm64","runner":"ubuntu-latest"},{"os":"linux","arch":"386","runner":"ubuntu-latest"}]'
        required: false
        type: string
      native-setup-command:
        description: "Shell command preparing one target (toolchain, vendored C library); runs before the build"
        default: ""
        required: false
        type: string
      native-build-command:
        description: "Shell command building the binary into $TARGET_BINARY; overrides the default GOOS/GOARCH go build"
        default: ""
        required: false
        type: string
      dependency-check-command:
        description: "Shell command inspecting $TARGET_BINARY; fails on non-baseline dynamic dependencies"
        default: ""
        required: false
        type: string
      smoke-command:
        description: "Shell command starting $TARGET_BINARY; when empty, native callers (native-build-command set) run the default --version smoke and pure-Go callers run no smoke"
        default: ""
        required: false
        type: string
      checksum-command:
        description: "Shell command emitting the SHA256SUMS file from the given asset paths (sorted, two spaces, lowercase); default: sha256sum | grep -v SHA256SUMS | sort -k2"
        default: ""
        required: false
        type: string
      notice-file:
        description: "Path in the caller repository whose content is attached to the release as a license notice; empty disables"
        default: ""
        required: false
        type: string

permissions:
  contents: write

# The official semver.org grammar translated to POSIX ERE, applied to the tag
# with the leading "v" stripped. Release tags must be full
# <major>.<minor>.<patch> versions; the optional prerelease identifier makes
# the GitHub release a prerelease.
env:
  SEMVER_PATTERN: '^([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)(-(([0-9]|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.([0-9]|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Compute target variables
        id: target
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ $SEMVER_PATTERN ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not a semver release tag; no release will be created" >&2
            exit 1
          fi
          ext=""
          [[ "${{ matrix.os }}" == "windows" ]] && ext=".exe"
          echo "target_binary=${{ inputs.project-name }}-v${version}-${{ matrix.os }}-${{ matrix.arch }}${ext}" >> "$GITHUB_OUTPUT"
      - name: Prepare native toolchain
        if: ${{ inputs.native-setup-command != '' }}
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_BINARY: ${{ steps.target.outputs.target_binary }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ${{ inputs.native-setup-command }}
      - name: Build
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_BINARY: ${{ steps.target.outputs.target_binary }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ -n "${{ inputs.native-build-command }}" ]]; then
            ${{ inputs.native-build-command }}
          else
            ldflags="-s -w"
            if [[ -n "${{ inputs.version-var }}" ]]; then
              ldflags="$ldflags -X '${{ inputs.version-var }}=${{ github.ref_name }}'"
            fi
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
              go build -trimpath -ldflags "$ldflags" -o "${{ steps.target.outputs.target_binary }}" .
          fi
      - name: Inspect runtime dependencies
        if: ${{ inputs.dependency-check-command != '' }}
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_BINARY: ${{ steps.target.outputs.target_binary }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ${{ inputs.dependency-check-command }}
      - name: Smoke test
        if: ${{ inputs.smoke-command != '' || inputs.native-build-command != '' }}
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_BINARY: ${{ steps.target.outputs.target_binary }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ -n "${{ inputs.smoke-command }}" ]]; then
            ${{ inputs.smoke-command }}
          else
            ./"${{ steps.target.outputs.target_binary }}" --version
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.target.outputs.target_binary }}
          if-no-files-found: error

  release:
    name: Assemble release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Attach the license notice
        if: ${{ inputs.notice-file != '' }}
        shell: bash
        run: |
          test -f "${{ inputs.notice-file }}" || { echo "notice file missing: ${{ inputs.notice-file }}" >&2; exit 1; }
          cp "${{ inputs.notice-file }}" dist/
      - name: Create checksums
        shell: bash
        run: |
          if [[ -n "${{ inputs.checksum-command }}" ]]; then
            ${{ inputs.checksum-command }} dist/* > dist/SHA256SUMS
          else
            (cd dist && sha256sum * | grep -v '  SHA256SUMS$' | sort -k2) > dist/SHA256SUMS
          fi
      - name: Classify release kind
        id: classify
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ $SEMVER_PATTERN ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not a semver release tag; no release will be created" >&2
            exit 1
          fi
          core="${version%%+*}"
          if [[ "$core" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --target "${{ inputs.branch }}" \
            --generate-notes \
            ${{ steps.classify.outputs.prerelease == 'true' && '--prerelease' || '' }}
